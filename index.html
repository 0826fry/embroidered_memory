<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f8f4">
  <meta name="description" content="Stitch a memory into a photograph. Even removed threads leave a trace.">
  <title>Embroidered Memory</title>
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
  <main id="app">
    <section id="landing" class="landing" aria-label="Upload a photograph">
      <label for="fileInput" class="upload-target" id="uploadTarget" tabindex="0" role="button">
        <svg class="upload-symbol" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M13 18V3m0 0L7.8 8.3M13 3l5.2 5.3M3.5 17.5v4.2h19v-4.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>UPLOAD AN IMAGE</span>
      </label>
      <input id="fileInput" type="file" accept="image/*" class="visually-hidden" aria-label="Choose an image">
    </section>

    <section id="workspace" class="workspace" aria-label="Embroidery work area" hidden>
      <canvas id="artCanvas" class="art-canvas" tabindex="0" aria-label="Photograph. Click an empty location to stitch, or click existing stitches to select."></canvas>
      <div id="ghostText" class="ghost-text" aria-hidden="true"></div>
      <div id="caret" class="caret" aria-hidden="true"></div>
      <div id="selectionBox" class="selection-box" aria-hidden="true"></div>

      <button id="menuToggle" class="menu-toggle" type="button" aria-controls="controls" aria-expanded="false" aria-label="Show settings">
        <span></span><span></span>
      </button>

      <div id="controls" class="controls" role="region" aria-label="Embroidery settings" aria-hidden="true">
        <div class="controls-top">
          <span class="controls-name">EMBROIDERED MEMORY</span>
          <span id="editContext" class="edit-context">NEXT STITCH</span>
          <span class="side-label">SIDE <strong id="sideValue">FRONT</strong></span>
          <button type="button" id="closePanel" class="close-panel" aria-label="Close settings">×</button>
        </div>
        <div class="controls-body">
          <label class="setting" for="sizeRange">
            <span class="setting-label">SIZE <output for="sizeRange" id="sizeValue">64</output></span>
            <input id="sizeRange" type="range" min="24" max="160" step="1" value="64">
          </label>
          <label class="setting" for="densityRange">
            <span class="setting-label">DENSITY <output for="densityRange" id="densityValue">55</output></span>
            <input id="densityRange" type="range" min="0" max="100" step="1" value="55">
          </label>
          <label class="setting" for="matchRange">
            <span class="setting-label">COLOR MATCH <output for="matchRange" id="matchValue">88</output></span>
            <input id="matchRange" type="range" min="0" max="100" step="1" value="88">
          </label>
          <label class="setting" for="variationRange">
            <span class="setting-label">COLOR VARIATION <output for="variationRange" id="variationValue">92</output></span>
            <input id="variationRange" type="range" min="0" max="100" step="1" value="92">
          </label>
          <label class="setting" for="traceRange">
            <span class="setting-label">TRACE DEPTH <output for="traceRange" id="traceValue">78</output></span>
            <input id="traceRange" type="range" min="0" max="100" step="1" value="78">
          </label>
          <label class="setting setting-select" for="fitSelect">
            <span class="setting-label">PHOTO VIEW</span>
            <select id="fitSelect" aria-label="Photo framing">
              <option value="cover">FILL SCREEN</option>
              <option value="contain">FIT IMAGE</option>
            </select>
          </label>
          <label class="connection-setting" for="connectionToggle">
            <input id="connectionToggle" type="checkbox" checked>
            <span>THREAD CONNECTION</span>
          </label>
        </div>
        <div class="controls-actions">
          <button type="button" id="flipBtn" class="flip-button" aria-label="View the reverse embroidered cloth">TURN OVER ↻</button>
          <button type="button" id="undoBtn">UNDO LAST</button>
          <button type="button" id="deleteBtn" disabled>DELETE SELECTED</button>
          <button type="button" id="clearBtn">CLEAR ALL</button>
          <button type="button" id="newBtn">NEW IMAGE</button>
          <button type="button" id="exportBackBtn">EXPORT BACK PNG ↗</button>
          <button type="button" id="exportBtn" class="export-btn">EXPORT FRONT PNG ↗</button>
        </div>
      </div>

      <!-- Native textarea retained for real macOS/Windows Korean IME events. -->
      <textarea id="imeInput" class="ime-input" rows="1" aria-label="Text to embroider" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <div id="announcement" class="visually-hidden" role="status" aria-live="polite"></div>
    </section>
    <canvas id="baseCanvas" hidden></canvas>
    <canvas id="maskCanvas" hidden></canvas>
  </main>
  <script src="script.js?v=3.0" defer></script>
</body>
</html>
